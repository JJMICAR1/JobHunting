name: mercado

# Fase 6: recuento de mercado diario por Telegram (solo enviar), leyendo la vista v_mercado_hoy.
# - Tras cada ejecucion del pipeline (workflow_run): si vino del cron -> prod; si no -> dev.
#   Si el pipeline se cancelo no se envia nada. workflow_run solo se activa con este archivo en main.
# - Manual (dev o prod) y push en claude/** que cambie este archivo (dev).
# - Sin TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID el job imprime el mensaje, avisa y termina bien.
on:
  workflow_run:
    workflows: [pipeline]
    types: [completed]
  workflow_dispatch:
    inputs:
      entorno:
        description: "Base de datos a resumir"
        type: choice
        options: [dev, prod]
        default: dev
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/mercado.yml"]

permissions:
  contents: read

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  mercado:
    # Un pipeline cancelado no deja datos nuevos que contar.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # En workflow_run se usa el codigo de main (nunca el de la rama que disparo el pipeline).
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Elegir entorno
        id: env
        env:
          EVENTO: ${{ github.event_name }}
          EVENTO_PIPELINE: ${{ github.event.workflow_run.event }}
          ENTORNO_MANUAL: ${{ inputs.entorno }}
        run: |
          case "$EVENTO" in
            # El pipeline solo escribe en prod cuando lo lanza el cron; cualquier otro evento es dev.
            workflow_run) if [ "$EVENTO_PIPELINE" = schedule ]; then E=prod; else E=dev; fi ;;
            workflow_dispatch) E="$ENTORNO_MANUAL" ;;
            *) E=dev ;;
          esac
          echo "entorno=$E" >> "$GITHUB_OUTPUT"
      - name: Mercado (dev)
        if: steps.env.outputs.entorno == 'dev'
        env:
          DATABASE_URL: ${{ secrets.NEO_URL_DEV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::El secreto NEO_URL_DEV no llega al workflow"; exit 1; fi
          python -m jobhunting.mercado --entorno dev
      - name: Mercado (prod)
        # Prod solo con el codigo de main (un dispatch desde una rama claude/ no llega a prod).
        if: steps.env.outputs.entorno == 'prod' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.NEO_URL_PROD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::El secreto NEO_URL_PROD no llega al workflow"; exit 1; fi
          python -m jobhunting.mercado --entorno prod
