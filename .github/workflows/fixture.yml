name: fixture

# Captura una página pública de Tecnoempleo para los tests del parser.
# Solo a mano, o al cambiar este workflow en una rama claude/. Sin cron, sin secretos.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de Tecnoempleo a capturar"
        required: false
        default: "https://www.tecnoempleo.com/ofertas-trabajo/?provincia=9"
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/fixture.yml"]

permissions:
  contents: read

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/captura_fixture.py "${URL}"
        env:
          URL: ${{ inputs.url || 'https://www.tecnoempleo.com/ofertas-trabajo/?provincia=9' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fixture
          path: fixture.html
          if-no-files-found: warn
