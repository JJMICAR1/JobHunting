name: pipeline

# Cron diario 05:17 UTC contra produccion (secreto NEO_URL_PROD). Manual: solo dev o dry-run.
# El cron solo se activa cuando este archivo esta en la rama por defecto (main).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      entorno:
        description: "dev (Neon rama dev) o dry-run (sin escribir en BD)"
        type: choice
        options: [dev, dry-run]
        default: dev
  # En ramas claude/: ejecucion real contra Neon dev (secreto NEO_URL_DEV). Solo si cambia este archivo (rev. 3).
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/pipeline.yml"]

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Salida: 0 ok, 2 bloqueado, 1 error. 1 y 2 hacen fallar el job.
      - name: Pipeline (dev)
        if: ${{ github.event_name == 'push' || inputs.entorno == 'dev' }}
        env:
          DATABASE_URL: ${{ secrets.NEO_URL_DEV }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::El secreto NEO_URL_DEV no llega al workflow"; exit 1; fi
          python -m jobhunting.pipeline
      - name: Pipeline (prod)
        if: ${{ github.event_name == 'schedule' }}
        env:
          DATABASE_URL: ${{ secrets.NEO_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::El secreto NEO_URL_PROD no llega al workflow"; exit 1; fi
          python -m jobhunting.pipeline
      - name: Pipeline (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.entorno == 'dry-run' }}
        run: python -m jobhunting.pipeline --dry-run
