name: sonda

# Solo a mano (pestaña Actions > sonda > Run workflow). Sin cron: no toca portales sola.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/sonda_portales.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sonda
          path: sonda.json
          if-no-files-found: warn
